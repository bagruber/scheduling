name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Version kommt aus dem packageManager-Feld in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # pnpm build ist zugleich die Typpruefung (tsc -b) fuer Frontend, Server
      # und shared/. pnpm lint fehlt hier absichtlich, siehe OFFENE-PUNKTE.md.
      - run: pnpm build
